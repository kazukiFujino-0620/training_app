<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:with="theme=${session.theme ?: 'light'}" 
      th:attr="data-theme=${theme}">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー管理 - トレーニング管理システム</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 機能見直し-1-#15（仮画面A）役割の選び直し */
        .role-review-banner { margin-bottom: 1rem; background: var(--bg-tertiary); border-left: 4px solid var(--warning-color); border-radius: 6px; padding: 0.6rem 0.9rem; font-size: 0.85rem; color: var(--text-primary); line-height: 1.7; }
        .role-review-mark { font-size: 0.78rem; color: var(--warning-color); font-weight: 600; }
        .role-review-form { display: inline-flex; gap: 6px; align-items: center; margin: 0 6px 6px 0; }
        .role-review-select { width: auto; min-width: 8.5rem; border-color: var(--warning-color); }
        .nowrap { white-space: nowrap; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
    </style>
</head>
<body class="bg-secondary">
    <!-- Header -->
    <header th:replace="~{common :: headerFragment}"></header>
    
    <!-- Main Content -->
    <main class="main-content">
        <div class="content-wrapper">
            <!-- Page Header -->
            <div class="mb-6">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-3xl font-bold text-primary">ユーザー管理</h1>
                        <p class="text-muted mt-2">ユーザー権限・ステータス管理</p>
                    </div>
                </div>
            </div>
            
            <div th:if="${successMessage}" class="alert alert-success mb-4" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger mb-4" th:text="${errorMessage}"></div>

            <!-- 機能見直し-1-#15（仮画面A）: 役割の確認が必要なスタッフの案内（ジム管理者・システム管理者のみ） -->
            <div th:if="${canReviewRoles and roleReviewCount > 0}" class="role-review-banner">
                <strong th:text="'役割の確認が必要なスタッフが' + ${roleReviewCount} + '人います。'">役割の確認が必要なスタッフが3人います。</strong>
                トレーナー登録で作られた店舗管理者と区別できないため、今の店舗管理者全員を対象にしています。<br>
                トレーナーか店舗管理者かを選んでください。<span class="nowrap">選ぶまでは今の権限のままです。</span>
            </div>

            <!-- Users Table -->
            <div class="card">
                <div class="card-header">
                    <h2 class="text-xl font-semibold">ユーザー一覧</h2>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th class="px-4 py-3 text-left">ID</th>
                                    <th class="px-4 py-3 text-left">ユーザー名</th>
                                    <th class="px-4 py-3 text-left">メールアドレス</th>
                                    <th class="px-4 py-3 text-left">所属</th>
                                    <th class="px-4 py-3 text-left">権限</th>
                                    <th class="px-4 py-3 text-left">ステータス</th>
                                    <th class="px-4 py-3 text-left">登録日</th>
                                    <th class="px-4 py-3 text-center min-w-[100px]">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${userList}">
                                    <td th:text="${user.userId}">1</td>
                                    <td th:text="${user.userName}">ユーザー名</td>
                                    <td th:text="${user.email}">email@example.com</td>
                                    <td th:text="${organizationNames[user.organizationId] ?: ''}" class="px-4 py-2">渋谷店</td>
                                    <td class="px-4 py-2">
                                        <span th:switch="${user.role}" class="nowrap">
                                            <span th:case="'ROLE_ADMIN'" class="badge badge-danger">システム管理者</span>
                                            <span th:case="'ROLE_ORG_ADMIN'" class="badge badge-danger">ジム管理者</span>
                                            <span th:case="'ROLE_STORE_ADMIN'" class="badge badge-secondary">店舗管理者</span>
                                            <span th:case="'ROLE_TRAINER'" class="badge badge-secondary">トレーナー</span>
                                            <span th:case="'ROLE_USER'" class="badge badge-primary">会員</span>
                                            <span th:case="*" class="badge badge-secondary" th:text="${user.role}"></span>
                                        </span>
                                        <span th:if="${canReviewRoles and user.roleReviewRequired == true}"
                                              class="role-review-mark nowrap">（要確認）</span>
                                    </td>
                                    <td class="px-4 py-2">
                                        <span th:if="${user.enabled == true}" 
                                              class="badge badge-success">
                                            有効
                                        </span>
                                        <span th:if="${user.enabled == false}" 
                                              class="badge badge-secondary">
                                            無効
                                        </span>
                                    </td>
                                    <td th:text="${#temporals.format(user.createDatetime, 'yyyy/MM/dd')}" class="px-4 py-2">2024/01/01</td>
                                    <td class="px-4 py-2 text-center">
                                        <form th:if="${canReviewRoles and user.roleReviewRequired == true}"
                                              th:action="@{/admin/user/{id}/role-review(id=${user.userId})}"
                                              method="post" class="role-review-form">
                                            <label class="sr-only" th:for="'roleReview' + ${user.userId}">役割を選ぶ</label>
                                            <select name="role" th:id="'roleReview' + ${user.userId}" class="form-control role-review-select">
                                                <option th:each="opt : ${roleReviewOptions}"
                                                        th:value="${opt.value()}"
                                                        th:text="${opt.label()}"></option>
                                            </select>
                                            <button type="submit" class="btn btn-outline btn-sm">保存</button>
                                        </form>
                                        <a th:href="@{/admin/user/edit/{id}(id=${user.userId})}" 
                                           class="btn btn-secondary btn-sm">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="inline mr-1">
                                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                            </svg>
                                            編集
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Back Button -->
            <div class="mt-6 flex gap-3">
                <a th:href="@{/admin/audit-logs}" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="inline mr-2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    監査ログ
                </a>
                <a th:href="@{/admin/deleted/users}" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="inline mr-2">
                        <polyline points="1 4 1 10 7 10"/>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                    </svg>
                    削除済みデータ
                </a>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer th:replace="~{common :: footerFragment}"></footer>
    
    <!-- JavaScript -->
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/admin-user-list.js}"></script>
</body>
</html>
