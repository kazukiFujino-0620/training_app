<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:with="theme=${session.theme ?: 'light'}"
      th:attr="data-theme=${theme}">
<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>テンプレート管理 - トレーニング管理システム</title>
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="bg-secondary">
  <header th:replace="~{common :: headerFragment}"></header>

  <main class="main-content" style="padding-top: 4rem;">
    <div class="template-page">

      <div class="page-header">
        <h1>テンプレート管理</h1>
        <button class="btn btn-primary" onclick="openCreateModal()">＋ 作成</button>
      </div>

      <!-- テンプレートなし -->
      <div th:if="${#lists.isEmpty(templates)}" style="text-align:center; padding:3rem 1rem; color:var(--text-muted);">
        <p>テンプレートがまだありません。</p>
        <p style="font-size:0.9rem;">「＋ 作成」ボタンからよく使う種目セットを登録できます。</p>
      </div>

      <!-- テンプレート一覧（itバグ-13: 種目ごとのブロック表示。/start/trainingの見た目に寄せる） -->
      <div class="template-grid">
        <div th:each="tmpl : ${templates}" class="template-card">
          <div class="template-card-header">
            <div>
              <span class="template-card-name" th:text="${tmpl.name}">テンプレート名</span>
              <span th:if="${tmpl.partCode != null and !#strings.isEmpty(tmpl.partCode)}"
                    class="template-part-badge" th:text="${partLabels[tmpl.partCode] ?: tmpl.partCode}">部位</span>
            </div>
            <div class="template-card-actions">
              <button class="btn btn-primary btn-sm"
                      th:onclick="'applyTemplateToday(' + ${tmpl.id} + ')'">今日に適用</button>
              <button class="btn btn-secondary btn-sm"
                      th:onclick="'openEditModal(' + ${tmpl.id} + ')'">編集</button>
              <button class="btn btn-danger btn-sm"
                      th:onclick="'deleteTemplateById(' + ${tmpl.id} + ')'">削除</button>
            </div>
          </div>
          <div th:if="${#lists.isEmpty(tmpl.items)}" class="template-exercise-block" style="color:var(--text-muted); font-size:0.85rem;">
            種目が登録されていません
          </div>
          <div th:each="group : ${tmpl.itemGroups}" class="template-exercise-block">
            <div class="template-exercise-name" th:text="${group.itemName}">種目名</div>
            <div th:each="set, iter : ${group.sets}" class="template-set-row">
              <span class="template-set-num" th:text="${iter.count}">1</span>
              <span class="template-set-badge"
                    th:classappend="${set.setType == 'WARMUP' ? 'set-type-warmup' : (set.setType == 'DROP' ? 'set-type-drop' : 'set-type-main')}"
                    th:text="${set.setType == 'WARMUP' ? 'WU' : (set.setType == 'DROP' ? 'DROP' : 'SET')}">SET</span>
              <span class="template-set-val">
                <span th:if="${set.weight != null}" th:text="${set.weight + 'kg'}">0kg</span>
                <span th:if="${set.reps != null}" th:text="${' × ' + set.reps + '回'}"> × 0回</span>
              </span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- itバグ-13: 種目ピッカー用データ（部位ごとの種目一覧） -->
  <script th:inline="javascript">
    window.itemsByPart = /*[[${itemsByPart}]]*/ {};
  </script>

  <!-- 作成・編集モーダル -->
  <div id="templateModal" class="template-modal-overlay hidden">
    <div class="template-modal-content">
      <h3 id="templateModalTitle">テンプレートを作成</h3>

      <div class="form-group" style="margin-top:1rem;">
        <label class="form-label">テンプレート名 <span style="color:red;">*</span></label>
        <input type="text" id="tplName" class="form-control" placeholder="例: 胸の日A" maxlength="100">
      </div>

      <div class="form-group">
        <label class="form-label">部位</label>
        <select id="tplPartCode" class="form-control form-select">
          <option value="">-- 未選択（全部位） --</option>
          <option value="CHEST">胸</option>
          <option value="BACK">背中</option>
          <option value="SHOULDER">肩</option>
          <option value="ARM">腕</option>
          <option value="LEG">脚</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">メモ</label>
        <input type="text" id="tplMemo" class="form-control" placeholder="任意" maxlength="500">
      </div>

      <!-- itバグ-13: 種目を先に選び、種目ごとにセットを組む2段階フロー（/training/registerと同じ考え方） -->
      <div class="form-group">
        <label class="form-label">種目・セット構成</label>
        <div id="tplConfigBlocks"><!-- 選択済み種目のセット構成ブロック（JSで動的生成） --></div>
        <button type="button" class="btn btn-outline w-full" onclick="toggleExercisePicker()" style="margin-top:0.5rem;">
          ＋ 種目を追加
        </button>
        <div id="tplExercisePicker" class="template-exercise-picker hidden">
          <!-- チェック式の種目グリッド（JSで動的生成） -->
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; margin-top:1.5rem; gap:0.5rem;">
        <button type="button" class="btn btn-secondary" onclick="closeTemplateModal()">キャンセル</button>
        <button type="button" class="btn btn-primary" onclick="saveTemplate()">保存</button>
      </div>
    </div>
  </div>

  <script th:src="@{/js/theme.js}"></script>
  <script>
  let editingTemplateId = null;

  function getCsrf() {
    return {
      token: document.querySelector('meta[name="_csrf"]')?.content || '',
      header: document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN'
    };
  }

  // itバグ-13: 種目ごとのセット構成をグループ化した状態で保持する
  // 構造: [{ itemName, sets: [{ setType, weight, reps }] }]
  let tplExercises = [];

  const SET_TYPE_INFO = {
    MAIN: { label: 'SET', cls: 'tpl-badge-main' },
    WARMUP: { label: 'WU', cls: 'tpl-badge-warmup' },
    DROP: { label: 'DROP', cls: 'tpl-badge-drop' }
  };
  const SET_TYPE_CYCLE = { MAIN: 'DROP', DROP: 'WARMUP', WARMUP: 'MAIN' };

  function toggleExercisePicker() {
    const picker = document.getElementById('tplExercisePicker');
    const opening = picker.classList.contains('hidden');
    if (opening) renderExercisePicker();
    picker.classList.toggle('hidden', !opening);
  }

  function renderExercisePicker() {
    const picker = document.getElementById('tplExercisePicker');
    const partCode = document.getElementById('tplPartCode').value;
    const selectedNames = new Set(tplExercises.map(ex => ex.itemName));

    let candidates = [];
    if (partCode) {
      candidates = window.itemsByPart[partCode] || [];
    } else {
      Object.values(window.itemsByPart || {}).forEach(list => candidates.push(...list));
    }
    candidates = candidates.filter(item => !selectedNames.has(item.itemName));

    if (candidates.length === 0) {
      picker.innerHTML = '<div class="exercise-picker-empty">追加できる種目がありません</div>';
      return;
    }
    picker.innerHTML = candidates
      .map(item => `<button type="button" class="exercise-chip" onclick="addExerciseToConfig('${item.itemName.replace(/'/g, "\\'")}')">${item.itemName}</button>`)
      .join('');
  }

  function addExerciseToConfig(itemName) {
    tplExercises.push({ itemName, sets: [{ setType: 'MAIN', weight: null, reps: null }] });
    document.getElementById('tplExercisePicker').classList.add('hidden');
    renderConfigBlocks();
  }

  function removeConfigExercise(exIdx) {
    tplExercises.splice(exIdx, 1);
    renderConfigBlocks();
  }

  function addConfigSet(exIdx) {
    const sets = tplExercises[exIdx].sets;
    const last = sets[sets.length - 1];
    sets.push({ setType: 'MAIN', weight: last ? last.weight : null, reps: last ? last.reps : null });
    renderConfigBlocks();
  }

  function removeConfigSet(exIdx, setIdx) {
    const sets = tplExercises[exIdx].sets;
    if (sets.length <= 1) return;
    sets.splice(setIdx, 1);
    renderConfigBlocks();
  }

  function cycleConfigSetType(exIdx, setIdx) {
    const set = tplExercises[exIdx].sets[setIdx];
    set.setType = SET_TYPE_CYCLE[set.setType] || 'MAIN';
    renderConfigBlocks();
  }

  function updateConfigValue(exIdx, setIdx, field, value) {
    tplExercises[exIdx].sets[setIdx][field] = value === '' ? null : value;
  }

  function renderConfigBlocks() {
    const container = document.getElementById('tplConfigBlocks');
    if (tplExercises.length === 0) {
      container.innerHTML = '';
      return;
    }
    container.innerHTML = tplExercises.map((ex, exIdx) => {
      const rows = ex.sets.map((set, setIdx) => {
        const info = SET_TYPE_INFO[set.setType] || SET_TYPE_INFO.MAIN;
        return `
          <div class="config-set-row">
            <span class="config-set-num">${setIdx + 1}</span>
            <button type="button" class="tpl-badge-btn ${info.cls}" onclick="cycleConfigSetType(${exIdx}, ${setIdx})">${info.label}</button>
            <input type="number" class="tpl-input" placeholder="kg" step="0.5"
                   value="${set.weight ?? ''}" oninput="updateConfigValue(${exIdx}, ${setIdx}, 'weight', this.value)">
            <span style="font-size:0.8rem; color:var(--text-muted);">×</span>
            <input type="number" class="tpl-input" placeholder="回"
                   value="${set.reps ?? ''}" oninput="updateConfigValue(${exIdx}, ${setIdx}, 'reps', this.value)">
            <button type="button" class="config-set-remove" ${ex.sets.length <= 1 ? 'disabled' : ''}
                    onclick="removeConfigSet(${exIdx}, ${setIdx})">✕</button>
          </div>`;
      }).join('');
      return `
        <div class="template-config-block">
          <div class="config-block-header">
            <span class="config-block-name">${ex.itemName}</span>
            <button type="button" class="config-block-remove" onclick="removeConfigExercise(${exIdx})">✕</button>
          </div>
          ${rows}
          <button type="button" class="config-block-add-set" onclick="addConfigSet(${exIdx})">＋ セット追加</button>
        </div>`;
    }).join('');
  }

  // フラットな items 配列（itemName・setNumber単位）を種目ごとにグループ化する
  function groupItemsToExercises(items) {
    const grouped = [];
    const indexByName = new Map();
    (items || []).forEach(item => {
      let idx = indexByName.get(item.itemName);
      if (idx === undefined) {
        idx = grouped.length;
        indexByName.set(item.itemName, idx);
        grouped.push({ itemName: item.itemName, sets: [] });
      }
      grouped[idx].sets.push({
        setType: item.setType || 'MAIN',
        weight: item.weight ?? null,
        reps: item.reps ?? null
      });
    });
    return grouped;
  }

  function openCreateModal() {
    editingTemplateId = null;
    document.getElementById('templateModalTitle').textContent = 'テンプレートを作成';
    document.getElementById('tplName').value = '';
    document.getElementById('tplPartCode').value = '';
    document.getElementById('tplMemo').value = '';
    tplExercises = [];
    document.getElementById('tplExercisePicker').classList.add('hidden');
    renderConfigBlocks();
    document.getElementById('templateModal').classList.remove('hidden');
  }

  function openEditModal(templateId) {
    fetch('/api/templates')
      .then(r => r.json())
      .then(templates => {
        const tmpl = templates.find(t => t.id === templateId);
        if (!tmpl) return;
        editingTemplateId = templateId;
        document.getElementById('templateModalTitle').textContent = 'テンプレートを編集';
        document.getElementById('tplName').value = tmpl.name || '';
        document.getElementById('tplPartCode').value = tmpl.partCode || '';
        document.getElementById('tplMemo').value = tmpl.memo || '';
        tplExercises = groupItemsToExercises(tmpl.items);
        document.getElementById('tplExercisePicker').classList.add('hidden');
        renderConfigBlocks();
        document.getElementById('templateModal').classList.remove('hidden');
      });
  }

  function closeTemplateModal() {
    document.getElementById('templateModal').classList.add('hidden');
  }

  function saveTemplate() {
    const name = document.getElementById('tplName').value.trim();
    if (!name) { alert('テンプレート名を入力してください。'); return; }

    const partCode = document.getElementById('tplPartCode').value;
    const memo = document.getElementById('tplMemo').value.trim();

    const items = [];
    let displayOrder = 0;
    tplExercises.forEach(ex => {
      ex.sets.forEach((set, setIdx) => {
        items.push({
          itemName: ex.itemName,
          setNumber: setIdx + 1,
          setType: set.setType || 'MAIN',
          weight: set.weight !== null && set.weight !== '' ? parseFloat(set.weight) : null,
          reps: set.reps !== null && set.reps !== '' ? parseInt(set.reps, 10) : null,
          displayOrder: displayOrder++
        });
      });
    });

    const csrf = getCsrf();
    const url = editingTemplateId ? `/api/templates/${editingTemplateId}/update` : '/api/templates';
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', [csrf.header]: csrf.token },
      body: JSON.stringify({ name, partCode, memo, items })
    }).then(r => {
      if (r.ok) { closeTemplateModal(); location.reload(); }
      else { alert('保存に失敗しました。'); }
    }).catch(() => alert('通信エラーが発生しました。'));
  }

  function deleteTemplateById(templateId) {
    if (!confirm('このテンプレートを削除しますか？')) return;
    const csrf = getCsrf();
    fetch(`/api/templates/${templateId}/delete`, {
      method: 'POST',
      headers: { [csrf.header]: csrf.token }
    }).then(r => {
      if (r.ok) location.reload();
      else alert('削除に失敗しました。');
    });
  }

  function applyTemplateToday(templateId) {
    const today = new Date().toISOString().split('T')[0];
    const csrf = getCsrf();
    fetch(`/api/templates/${templateId}/apply`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', [csrf.header]: csrf.token },
      body: JSON.stringify({ date: today })
    }).then(r => {
      if (!r.ok) { alert('適用に失敗しました。'); return; }
      return r.json();
    }).then(data => {
      if (!data) return;
      if (data.duplicateItems && data.duplicateItems.length > 0) {
        alert('以下の種目は当日すでに追加されています:\n' + data.duplicateItems.join('\n') + '\n\n重複を許可して追加しました。');
      }
      window.location.href = '/start/training?date=' + today;
    }).catch(() => alert('通信エラーが発生しました。'));
  }

  // 部位変更時、種目ピッカーが開いていれば表示中の候補を再フィルタする
  document.getElementById('tplPartCode').addEventListener('change', function() {
    if (!document.getElementById('tplExercisePicker').classList.contains('hidden')) {
      renderExercisePicker();
    }
  });

  // モーダル外クリックで閉じる
  document.getElementById('templateModal').addEventListener('click', function(e) {
    if (e.target === this) closeTemplateModal();
  });
  </script>

  <div th:replace="~{common :: sessionModalsFragment}"></div>
</body>
</html>
