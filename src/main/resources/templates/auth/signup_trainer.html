<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トレーナー登録 - トレーニング管理システム</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-container">
    <div class="login-background"></div>

    <!-- Theme Toggle -->
    <div class="theme-toggle-login">
        <button class="settings-btn" data-action="toggleTheme" aria-label="テーマ切り替え">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
            </div>
            <h1 class="login-title">トレーナー登録</h1>
            <p class="login-subtitle">配布された招待コードでトレーナーアカウントを作成</p>
        </div>

        <div th:replace="~{common :: errorMessageFragment}"></div>

        <!-- Trainer Signup Form -->
        <form th:action="@{/signup/trainer}" th:object="${trainerSignupForm}" method="post" class="login-form">
            <div class="form-group">
                <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="7" width="18" height="10" rx="2"/>
                    <path d="M3 9l9 5 9-5"/>
                </svg>
                <input
                    type="text"
                    th:field="*{inviteCode}"
                    class="form-control"
                    placeholder="招待コード"
                    required
                    autocomplete="off">
                <p th:if="${#fields.hasErrors('inviteCode')}" th:errors="*{inviteCode}" class="text-danger text-xs mt-1"></p>
            </div>

            <div class="form-group">
                <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <input
                    type="text"
                    th:field="*{username}"
                    class="form-control"
                    placeholder="ユーザー名"
                    required
                    autocomplete="username">
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger text-xs mt-1"></p>
            </div>

            <div class="form-group">
                <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </svg>
                <input
                    type="email"
                    th:field="*{email}"
                    class="form-control"
                    placeholder="メールアドレス"
                    required
                    autocomplete="email">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger text-xs mt-1"></p>
            </div>

            <div class="form-group">
                <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input
                    type="password"
                    th:field="*{password}"
                    class="form-control"
                    placeholder="パスワード"
                    required
                    autocomplete="new-password">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger text-xs mt-1"></p>
            </div>

            <div class="form-group">
                <svg class="form-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input
                    type="password"
                    th:field="*{password_confirm}"
                    class="form-control"
                    placeholder="パスワード（確認用）"
                    required
                    autocomplete="new-password">
                <p th:if="${#fields.hasErrors('password_confirm')}" th:errors="*{password_confirm}" class="text-danger text-xs mt-1"></p>
            </div>

            <button type="submit" class="btn btn-primary login-btn">
                <span class="btn-text">登録</span>
                <div class="spinner"></div>
            </button>
        </form>

        <!-- Footer -->
        <div class="login-footer">
            <p>すでにアカウントをお持ちですか？</p>
            <a th:href="@{/login}" class="text-primary">ログイン</a>
        </div>
    </div>

    <!-- JavaScript -->
    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
