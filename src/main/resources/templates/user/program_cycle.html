<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      th:with="theme=${session.theme ?: 'light'}"
      th:attr="data-theme=${theme}">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>期分けプログラム - トレーニング管理システム</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/periodization.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-secondary">
    <header th:replace="~{common :: headerFragment}"></header>

    <!-- 機能見直し-1-#3 期分けプログラム（モックアップ版11の01/02/03/04/06/08）。表示はperiodization-user.jsが組み立てる -->
    <main class="main-content">
        <div class="pz-page" id="pz-root">
            <h1 class="pz-title">期分けプログラム</h1>
            <p class="pz-sub">週ごとの強度とディロード週を計画して進めるプログラムです</p>
            <div id="pz-proposal"></div>
            <div id="pz-main"><div class="pz-card"><div class="pz-empty">読み込み中…</div></div></div>
        </div>
    </main>

    <footer th:replace="~{common :: footerFragment}"></footer>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/periodization-common.js}"></script>
    <script th:src="@{/js/periodization-user.js}"></script>
</body>
</html>
