# Local development profile properties
LOGS_PATH=./logs

logging.level.org.springframework=DEBUG
logging.level.com.example.traning=DEBUG

# ローカルDB認証情報（本番は環境変数で注入）
spring.datasource.username=root
spring.datasource.password=
jasypt.encryptor.password=local-dev-key

# Remember-me シークレットキー（本番は強力なランダム値を環境変数 APP_REMEMBER_ME_KEY に設定）
app.security.remember-me-key=local-dev-remember-me-key-change-in-production

# JWT シークレットキー（Base64エンコード済み 256bit以上のランダム値）
# 鍵の値はファイルに書かず、環境変数 APP_JWT_SECRET で渡す（未設定時は起動失敗）。
# ローカル用の値の作り方・設定方法は README.md「ローカル開発に必要な環境変数」を参照。
app.jwt.secret=${APP_JWT_SECRET}

# バッチファイルパス（ローカル開発用）
BATCH_FILE_PATH=/Users/fujinoikki/Desktop/training_app/training_app/src/main/resources/input/master_data.csv
BATCH_ALLOWED_DIR=/Users/fujinoikki/Desktop/training_app/training_app/src/main/resources/input/

# Swagger UI (local development only)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml

