# Local development profile properties
LOGS_PATH=./logs

logging.level.org.springframework=DEBUG
logging.level.com.example.traning=DEBUG

# ローカルDB認証情報（本番は環境変数で注入）
spring.datasource.username=root
spring.datasource.password=
# Jasypt 暗号化パスワード。値はファイルに書かず環境変数 JASYPT_ENCRYPTOR_PASSWORD で渡す（未設定時は起動失敗）。
jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD}

# Remember-me シークレットキー。値はファイルに書かず環境変数 APP_SECURITY_REMEMBER_ME_KEY で渡す（未設定時は起動失敗）。
app.security.remember-me-key=${APP_SECURITY_REMEMBER_ME_KEY}

# JWT シークレットキー（Base64エンコード済み 256bit以上のランダム値）
# 鍵の値はファイルに書かず、環境変数 APP_JWT_SECRET で渡す（未設定時は起動失敗）。
# ローカル用の値の作り方・設定方法は README.md「ローカル開発に必要な環境変数」を参照。
app.jwt.secret=${APP_JWT_SECRET}

# バッチファイルパス（ローカル開発用）
BATCH_FILE_PATH=/Users/fujinoikki/Desktop/training_app/training_app/src/main/resources/input/master_data.csv
BATCH_ALLOWED_DIR=/Users/fujinoikki/Desktop/training_app/training_app/src/main/resources/input/

# Swagger UI (local development only)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml

