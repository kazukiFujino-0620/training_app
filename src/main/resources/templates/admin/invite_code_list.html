<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:with="theme=${session.theme ?: 'light'}"
      th:attr="data-theme=${theme}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招待コード管理 - トレーニング管理システム</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 機能見直し-1-#15（仮画面B）招待コードの用途 */
        .invite-purpose { flex-basis: 100%; border: 1px solid var(--border-color); border-radius: 6px; padding: 0.5rem 0.75rem; margin: 0; }
        .invite-purpose legend { padding: 0 4px; }
        .invite-purpose-option { display: inline-flex; gap: 4px; align-items: center; margin-right: 1.25rem; white-space: nowrap; }
        .invite-purpose-warn { font-size: 0.8rem; color: var(--text-secondary); background: var(--bg-tertiary); border-left: 3px solid var(--warning-color); border-radius: 4px; padding: 0.4rem 0.6rem; margin-top: 0.4rem; line-height: 1.7; }
        .nowrap { white-space: nowrap; }
        /* itバグ-49: トレーナー用を選んだときだけ出す説明。横並びのときは入力欄の行の下（割り当て先の真下）、縦並びのときは割り当て先の直後に出す */
        .invite-org-help { flex-basis: 100%; order: 1; font-size: 0.8rem; color: var(--text-secondary); margin: -0.5rem 0 0; }
        @media (max-width: 600px) { .invite-org-help { order: 0; } }
    </style>
</head>
<body class="bg-secondary">
    <header th:replace="~{common :: headerFragment}"></header>

    <main class="main-content">
        <div class="content-wrapper">
            <div class="mb-6">
                <h1 class="text-3xl font-bold text-primary">招待コード管理</h1>
                <p class="text-muted mt-2">
                    新規登録時に組織へ割り当てるための招待コードを発行・管理します。<br>
                    会員用は会員の新規登録（/signup）で、トレーナー用は<a th:href="@{/signup/trainer}">トレーナー登録（/signup/trainer）</a>で使います。
                </p>
            </div>

            <div th:if="${successMessage}" class="alert alert-success mb-4" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger mb-4" th:text="${errorMessage}"></div>

            <div class="card mb-6">
                <div class="card-header">
                    <h2 class="text-xl font-semibold">新規発行</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/invite-codes}" method="post" class="flex gap-3 flex-wrap items-end">
                        <!-- 機能見直し-1-#15・itバグ-44（仮画面B）: 用途 -->
                        <fieldset class="invite-purpose">
                            <legend class="text-sm text-secondary">用途</legend>
                            <label class="invite-purpose-option">
                                <input type="radio" name="purpose" value="MEMBER" checked>
                                会員用<span class="text-muted">（会員の新規登録で使う）</span>
                            </label>
                            <label class="invite-purpose-option">
                                <input type="radio" name="purpose" value="TRAINER">
                                トレーナー用<span class="text-muted">（トレーナー登録で使う）</span>
                            </label>
                            <div class="invite-purpose-warn">
                                トレーナー用のコードは、トレーナー本人にだけ渡してください。<br>
                                有効期限と使用回数の上限を設定することをおすすめします。
                            </div>
                        </fieldset>
                        <div>
                            <label class="text-sm text-secondary">割り当て先組織</label>
                            <select id="invite-organization" name="organizationId" required class="form-control">
                                <option th:each="org : ${organizations}" th:value="${org.id}"
                                        th:attr="data-org-type=${org.type}"
                                        th:text="${org.name} + (${org.type == 'STORE'} ? '（店舗）' : '（組織）')"></option>
                            </select>
                        </div>
                        <!-- itバグ-49: トレーナー用は店舗宛てだけ（切り替えは/js/invite-code-form.js）。入力欄の幅を変えないよう別の行に出す -->
                        <p id="invite-organization-help" class="invite-org-help" hidden><span class="nowrap">トレーナー用は店舗だけを選べます。</span><span class="nowrap">トレーナーは選んだ店舗の会員を担当します。</span></p>
                        <div>
                            <label class="text-sm text-secondary">有効期限（任意）</label>
                            <input type="date" name="expiresAt" class="form-control">
                        </div>
                        <div>
                            <label class="text-sm text-secondary">使用回数上限（任意）</label>
                            <input type="number" name="maxUses" min="1" placeholder="無制限" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary">発行する</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="text-xl font-semibold">発行済み一覧</h2>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th class="px-4 py-3 text-left">コード</th>
                                    <th class="px-4 py-3 text-left">用途</th>
                                    <th class="px-4 py-3 text-left">割り当て先</th>
                                    <th class="px-4 py-3 text-left">期限</th>
                                    <th class="px-4 py-3 text-left">使用状況</th>
                                    <th class="px-4 py-3 text-left">状態</th>
                                    <th class="px-4 py-3 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${codes}">
                                    <td><code th:text="${c.code}">CODE</code></td>
                                    <td class="nowrap" th:text="${c.purpose == 'TRAINER' ? 'トレーナー用' : '会員用'}">会員用</td>
                                    <td th:text="${organizationNames.get(c.organizationId)} ?: ('id:' + ${c.organizationId})">組織名</td>
                                    <td th:text="${c.expiresAt != null ? #temporals.format(c.expiresAt, 'yyyy/MM/dd') : '無期限'}">-</td>
                                    <td th:text="${c.usedCount} + ' / ' + (${c.maxUses != null} ? ${c.maxUses} : '∞')">0 / ∞</td>
                                    <td>
                                        <span th:if="${c.revokedAt != null}" class="badge badge-secondary">失効済み</span>
                                        <span th:if="${c.revokedAt == null and c.expiresAt != null and c.expiresAt.isBefore(T(java.time.LocalDateTime).now())}" class="badge badge-secondary">期限切れ</span>
                                        <span th:if="${c.revokedAt == null and c.maxUses != null and c.usedCount >= c.maxUses}" class="badge badge-secondary">上限到達</span>
                                        <span th:if="${c.revokedAt == null and (c.expiresAt == null or !c.expiresAt.isBefore(T(java.time.LocalDateTime).now())) and (c.maxUses == null or c.usedCount &lt; c.maxUses)}" class="badge badge-success">有効</span>
                                    </td>
                                    <td class="text-center">
                                        <form th:if="${c.revokedAt == null}" th:action="@{/admin/invite-codes/{id}/revoke(id=${c.id})}" method="post" style="display:inline">
                                            <button type="submit" class="btn btn-danger btn-sm">失効</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{common :: footerFragment}"></footer>
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/invite-code-form.js}"></script>
</body>
</html>
