<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      th:with="theme=${session.theme ?: 'light'}"
      th:attr="data-theme=${theme}">
<head>
  <meta charset="UTF-8"/>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>トレーナーアドバイス - トレーニング管理システム</title>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .advice-page { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    .advice-manage-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .advice-manage-card .form-group { margin-bottom: 14px; }
    .advice-manage-card .form-group label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; }
    .advice-manage-card .form-control { width: 100%; box-sizing: border-box; }
    .sent-row { padding: 14px 0; border-bottom: 1px solid var(--border-color); }
    .sent-row:last-child { border-bottom: none; }
    .sent-row .sent-meta { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; }
    .sent-row .sent-body { font-size: 0.9rem; color: var(--text-primary); white-space: pre-wrap; }
    .advice-empty { text-align: center; color: var(--text-muted); padding: 32px 16px; font-size: 0.88rem; }
    .sent-row .sent-date-badge {
      display: inline-block; font-size: 0.72rem; font-weight: 600; color: var(--primary-color);
      background: var(--primary-soft, var(--bg-tertiary)); border-radius: 6px; padding: 1px 6px; margin-right: 6px;
    }
    .training-preview {
      background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 10px;
      padding: 12px 14px; margin-top: 4px; font-size: 0.85rem;
    }
    .training-preview .tp-title { font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
    .training-preview .tp-item { padding: 4px 0; color: var(--text-secondary); border-top: 1px solid var(--border-color); }
    .training-preview .tp-item:first-of-type { border-top: none; }
    .training-preview .tp-empty { color: var(--text-muted); }
    .assignment-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--border-color); flex-wrap: wrap;
    }
    .assignment-row:last-child { border-bottom: none; }
    .assignment-row .assignment-trainee { font-size: 0.9rem; color: var(--text-primary); }
    .assignment-row .assignment-current { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .assignment-row form { display: flex; align-items: center; gap: 8px; margin: 0; }
    .assignment-row select { min-width: 160px; }
  </style>
</head>
<body class="bg-secondary">
  <header th:replace="~{common :: headerFragment}"></header>

  <main class="advice-page">
    <div class="mb-6">
      <h1 style="color:var(--text-primary);font-size:1.5rem;font-weight:700;margin:0;">トレーナーアドバイス</h1>
      <p style="color:var(--text-muted);font-size:0.85rem;margin:4px 0 0;">担当トレーニーへメッセージを送信します</p>
    </div>

    <div th:if="${successMessage}" class="alert alert-success mb-4" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger mb-4" th:text="${errorMessage}"></div>

    <div class="advice-manage-card">
      <form th:action="@{/trainer/advice}" method="post">
        <div class="form-group">
          <label>宛先</label>
          <select name="targetUserId" id="targetUserId" class="form-control" required>
            <option value="">トレーニーを選択してください</option>
            <option th:each="trainee : ${trainees}"
                    th:value="${trainee.userId}"
                    th:selected="${selectedTargetUserId != null and selectedTargetUserId == trainee.userId}"
                    th:text="${trainee.userName + '（' + trainee.email + '）'}"></option>
          </select>
        </div>
        <div class="form-group">
          <label>対象日（トレーニング実施日）</label>
          <input type="date" name="targetDate" id="targetDate" class="form-control"
                 th:value="${#temporals.format(selectedDate, 'yyyy-MM-dd')}" required/>
        </div>
        <div class="form-group">
          <label>対象日のトレーニング内容</label>
          <div id="trainingPreview" class="training-preview">
            <div class="tp-empty">宛先と対象日を選択すると、その日のトレーニング内容が表示されます</div>
          </div>
        </div>
        <div class="form-group">
          <label>メッセージ</label>
          <textarea name="body" class="form-control" rows="4"
                    placeholder="例: 今週も頻度高く進めていますね。この調子で続けましょう！"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">送信する</button>
      </form>
    </div>

    <div class="advice-manage-card">
      <h2 style="margin:0 0 4px;font-size:1rem;color:var(--text-primary);">担当トレーナー管理</h2>
      <p style="color:var(--text-muted);font-size:0.8rem;margin:0 0 12px;">トレーニーごとの担当トレーナーを変更できます（初回送信者が自動的に担当になります）</p>
      <div th:if="${#lists.isEmpty(assignmentTrainees)}" class="advice-empty">担当範囲内にトレーニーがいません</div>
      <div th:each="trainee : ${assignmentTrainees}" class="assignment-row">
        <div>
          <div class="assignment-trainee" th:text="${trainee.userName + '（' + trainee.email + '）'}"></div>
          <div class="assignment-current">
            <span th:if="${trainee.assignedTrainerId == null}">現在の担当: 未割当</span>
            <span th:unless="${trainee.assignedTrainerId == null}"
                  th:text="${'現在の担当: ' + (trainerNames[trainee.assignedTrainerId] ?: ('ID:' + trainee.assignedTrainerId))}"></span>
          </div>
        </div>
        <form th:action="@{/trainer/advice/assignments/{id}(id=${trainee.userId})}" method="post">
          <select name="newTrainerId" class="form-control">
            <option value="">未割当に戻す</option>
            <option th:each="candidate : ${eligibleTrainers}"
                    th:value="${candidate.userId}"
                    th:selected="${trainee.assignedTrainerId != null and trainee.assignedTrainerId == candidate.userId}"
                    th:text="${candidate.userName}"></option>
          </select>
          <button type="submit" class="btn btn-outline btn-sm">変更</button>
        </form>
      </div>
    </div>

    <div class="advice-manage-card">
      <h2 style="margin:0 0 12px;font-size:1rem;color:var(--text-primary);">送信済みメッセージ</h2>
      <div th:if="${#lists.isEmpty(sentAdvices)}" class="advice-empty">送信済みのメッセージはありません</div>
      <div th:each="advice : ${sentAdvices}" class="sent-row">
        <div class="sent-meta">
          <span>
            <span class="sent-date-badge" th:text="${'対象日: ' + #temporals.format(advice.targetDate, 'MM/dd')}">対象日</span>
            <span th:text="${#temporals.format(advice.createdAt, 'yyyy/MM/dd HH:mm')}">2026/08/16</span>
          </span>
          <form th:action="@{/trainer/advice/{id}/delete(id=${advice.id})}" method="post" style="margin:0;">
            <button type="submit" class="btn btn-outline btn-sm"
                    onclick="return confirm('このメッセージを取り下げますか？')">取り下げ</button>
          </form>
        </div>
        <div class="sent-body" th:text="${advice.body}">本文</div>
      </div>
    </div>
  </main>

  <script th:src="@{/js/theme.js}"></script>
  <script>
    (function () {
      var userSelect = document.getElementById('targetUserId');
      var dateInput = document.getElementById('targetDate');
      var preview = document.getElementById('trainingPreview');
      if (!userSelect || !dateInput || !preview) return;

      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
      }

      function renderPreview(trainings) {
        if (!trainings || trainings.length === 0) {
          preview.innerHTML = '<div class="tp-empty">この日のトレーニング記録はありません</div>';
          return;
        }
        var html = '<div class="tp-title">' + trainings.length + '種目</div>';
        trainings.forEach(function (t) {
          html += '<div class="tp-item">' + escapeHtml(t.menu || '') + '（' + escapeHtml(t.partName || '') + '）'
              + (t.isAllCompleted ? ' ・完了' : ' ・進行中') + '</div>';
        });
        preview.innerHTML = html;
      }

      function loadPreview() {
        var userId = userSelect.value;
        var date = dateInput.value;
        if (!userId || !date) {
          preview.innerHTML = '<div class="tp-empty">宛先と対象日を選択すると、その日のトレーニング内容が表示されます</div>';
          return;
        }
        preview.innerHTML = '<div class="tp-empty">読み込み中...</div>';
        fetch('/admin/training-details?userId=' + encodeURIComponent(userId) + '&date=' + encodeURIComponent(date))
          .then(function (res) {
            if (!res.ok) throw new Error('failed');
            return res.json();
          })
          .then(renderPreview)
          .catch(function () {
            preview.innerHTML = '<div class="tp-empty">トレーニング内容の取得に失敗しました</div>';
          });
      }

      userSelect.addEventListener('change', loadPreview);
      dateInput.addEventListener('change', loadPreview);
      if (userSelect.value && dateInput.value) loadPreview();
    })();
  </script>
</body>
</html>
