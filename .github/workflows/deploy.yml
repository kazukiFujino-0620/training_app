name: CI/CD for TrainingApp

on:
  push:
    branches: [master]

# 最小権限の原則: デプロイは読み取りのみ。
# サードパーティ Action 改ざん時の被害を最小化する。
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Javaのセットアップ
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # 2. Mavenビルド
      - name: Build with Maven
        run: mvn clean package -PGCP -DskipTests
        env:
          JASYPT_ENCRYPTOR_PASSWORD: ${{ secrets.JASYPT_PASSWORD }}

      # 4. JARファイルをサーバーに転送 (SCP)
      - name: Copy JAR to GCP VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "target/TraningApp-*.jar"
          target: "/opt/trainingapp/"
          strip_components: 1

      # 4b. マイグレーション用systemdユニットファイルを転送 (SCP)
      # リポジトリ側で内容が変わった場合も、次回デプロイで自動的にVM側へ反映される。
      - name: Copy migrate systemd unit to GCP VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "deploy/trainingapp-migrate.service"
          target: "/opt/trainingapp/"
          strip_components: 1

      # 5. 新JARへの差し替え + systemdユニットの更新 + DBマイグレーション適用（サービス再起動より前に実施）
      - name: Apply DB migration (Flyway)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 3m
          script: |
            cp /opt/trainingapp/TraningApp-*.jar /opt/trainingapp/trainingapp.jar
            sudo cp /opt/trainingapp/trainingapp-migrate.service /etc/systemd/system/trainingapp-migrate.service
            sudo systemctl daemon-reload
            sudo systemctl start trainingapp-migrate.service
            # Type=oneshotは正常完了後 inactive(dead) になり、`systemctl status`はこの状態に
            # 対して非ゼロを返す仕様のため、ここは表示目的のみとしステップの成否には影響させない
            # （成否の判定は直前の `systemctl start` の終了コードで行う）。
            sudo systemctl status trainingapp-migrate.service --no-pager || true

      # 6. サーバー上のアプリを再起動
      - name: Restart Application Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            sudo systemctl set-environment SPRING_PROFILES_ACTIVE=gcp
            sudo systemctl restart trainingapp
