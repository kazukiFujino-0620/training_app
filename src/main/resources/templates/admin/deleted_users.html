<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      th:with="theme=${session.theme ?: 'light'}"
      th:attr="data-theme=${theme}">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>削除済みユーザー - トレーニング管理システム</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-secondary">
    <header th:replace="~{common :: headerFragment}"></header>

    <main class="main-content">
        <div class="content-wrapper">
            <div class="mb-6">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-3xl font-bold text-primary">削除済みユーザー</h1>
                        <p class="text-muted mt-2">論理削除（退会・管理者削除）されたユーザーの一覧・復元</p>
                    </div>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success mb-4" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger mb-4" th:text="${errorMessage}"></div>

            <div class="card">
                <div class="card-header">
                    <h2 class="text-xl font-semibold">削除済みユーザー一覧</h2>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(deletedUsers)}" style="text-align: center; padding: 40px; color: var(--text-muted);">
                        削除済みのユーザーはありません
                    </div>

                    <div th:if="${!#lists.isEmpty(deletedUsers)}" class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th class="px-4 py-3 text-left">ID</th>
                                    <th class="px-4 py-3 text-left">ユーザー名</th>
                                    <th class="px-4 py-3 text-left">メールアドレス</th>
                                    <th class="px-4 py-3 text-left">削除日時</th>
                                    <th class="px-4 py-3 text-center min-w-[100px]">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${deletedUsers}">
                                    <td th:text="${user.userId}">1</td>
                                    <td th:text="${user.userName}">ユーザー名</td>
                                    <td th:text="${user.email}">email@example.com</td>
                                    <td th:text="${#temporals.format(user.deletedAt, 'yyyy/MM/dd HH:mm')}">2026/01/01 00:00</td>
                                    <td class="px-4 py-2 text-center">
                                        <form th:action="@{/admin/deleted/users/{id}/restore(id=${user.userId})}" method="post">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-secondary btn-sm"
                                                    onclick="return confirm('このユーザーを復元しますか？')">
                                                復元
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <a th:href="@{/admin/deleted/trainings}" class="btn btn-secondary">削除済みトレーニング</a>
            </div>
        </div>
    </main>

    <script th:src="@{/js/theme.js}"></script>
    <div th:replace="~{common :: sessionModalsFragment}"></div>
</body>
</html>
