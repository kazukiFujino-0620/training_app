<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:with="theme=${session.theme ?: 'light'}"
      th:attr="data-theme=${theme}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>組織・店舗管理 - トレーニング管理システム</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/training_modal.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-secondary">
    <header th:replace="~{common :: headerFragment}"></header>

    <main class="main-content">
        <div class="content-wrapper">
            <div class="mb-6">
                <h1 class="text-3xl font-bold text-primary">組織・店舗管理</h1>
                <p class="text-muted mt-2">ジム（組織）・店舗の一覧、新規作成、名称編集を行います。</p>
            </div>

            <div th:if="${successMessage}" class="alert alert-success mb-4" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger mb-4" th:text="${errorMessage}"></div>

            <div class="card mb-6">
                <div class="card-header">
                    <h2 class="text-xl font-semibold">組織・店舗一覧</h2>
                </div>
                <div class="card-body">
                    <ul style="list-style:none;margin:0;padding:0;">
                        <li th:each="gym : ${tree}" style="margin-bottom:1rem;">
                            <div class="flex items-center justify-between px-4 py-3 bg-tertiary" style="border-radius:var(--radius-md);">
                                <div class="flex items-center gap-3">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M9 13h1M14 9h1M14 13h1"/></svg>
                                    <div>
                                        <div class="font-bold" th:text="${gym.name()}">ジム名</div>
                                        <div class="text-muted text-xs" th:text="'GYM ・ id: ' + ${gym.id()} + ' ・ 所属ユーザー ' + ${gym.userCount()} + '名'">GYM</div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-outline btn-sm rename-btn" th:data-id="${gym.id()}" th:data-name="${gym.name()}">編集</button>
                            </div>
                            <ul style="list-style:none;margin:.5rem 0 0 2.2rem;padding-left:1rem;border-left:2px solid var(--border-color);display:flex;flex-direction:column;gap:.5rem;">
                                <li th:each="store : ${gym.children()}">
                                    <div class="flex items-center justify-between px-4 py-3 bg-tertiary" style="border-radius:var(--radius-md);">
                                        <div class="flex items-center gap-3">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5M4 9h16v11H4zM9 20v-6h6v6"/></svg>
                                            <div>
                                                <div class="font-semibold" th:text="${store.name()}">店舗名</div>
                                                <div class="text-muted text-xs" th:text="'STORE ・ id: ' + ${store.id()} + ' ・ ' + ${store.userCount()} + '名'">STORE</div>
                                            </div>
                                        </div>
                                        <button type="button" class="btn btn-outline btn-sm rename-btn" th:data-id="${store.id()}" th:data-name="${store.name()}">編集</button>
                                    </div>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="card mb-6">
                <div class="card-header">
                    <h2 class="text-xl font-semibold">新規作成</h2>
                </div>
                <div class="card-body">
                    <div sec:authorize="hasRole('ADMIN')" class="mb-6">
                        <h3 class="font-semibold mb-2">組織（GYM）を新規作成</h3>
                        <form th:action="@{/admin/organizations/gym}" method="post" class="flex gap-3 flex-wrap items-end">
                            <div>
                                <label class="text-sm text-secondary">名称</label>
                                <input type="text" name="name" required placeholder="例）Cジム" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-primary">作成する</button>
                        </form>
                    </div>

                    <div>
                        <h3 class="font-semibold mb-2">店舗（STORE）を新規登録</h3>
                        <form th:action="@{/admin/organizations/store}" method="post" class="flex gap-3 flex-wrap items-end">
                            <div>
                                <label class="text-sm text-secondary">名称</label>
                                <input type="text" name="name" required placeholder="例）C店" class="form-control">
                            </div>
                            <div>
                                <label class="text-sm text-secondary">所属GYM</label>
                                <select name="parentGymId" required class="form-control" sec:authorize="hasRole('ADMIN')">
                                    <option th:each="gym : ${tree}" th:value="${gym.id()}" th:text="${gym.name()}"></option>
                                </select>
                                <input type="hidden" name="parentGymId" th:if="${!isAdmin}" th:value="${tree[0].id()}">
                                <span sec:authorize="!hasRole('ADMIN')" class="text-muted text-xs" th:text="${tree[0].name()} + '（自組織固定）'"></span>
                            </div>
                            <button type="submit" class="btn btn-primary">登録する</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- 編集モーダル -->
    <div id="renameModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h3 class="font-semibold mb-3">名称の編集</h3>
            <form id="renameForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="text" name="name" id="renameNameInput" required class="form-control mb-3">
                <div class="flex gap-3">
                    <button type="submit" class="btn btn-primary">保存する</button>
                    <button type="button" class="btn btn-outline" onclick="closeRenameModal()">キャンセル</button>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{common :: footerFragment}"></footer>

    <script th:src="@{/js/theme.js}"></script>
    <script>
        function openRenameModal(id, name) {
            document.getElementById('renameNameInput').value = name;
            document.getElementById('renameForm').action = '/admin/organizations/' + id + '/rename';
            document.getElementById('renameModal').style.display = 'flex';
        }
        function closeRenameModal() {
            document.getElementById('renameModal').style.display = 'none';
        }
        document.querySelectorAll('.rename-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                openRenameModal(btn.dataset.id, btn.dataset.name);
            });
        });
    </script>
</body>
</html>
