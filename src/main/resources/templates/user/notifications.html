<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:with="theme=${session.theme ?: 'light'}"
      th:attr="data-theme=${theme}">
<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通知設定 - トレーニング管理システム</title>
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .notifications-page { max-width: 600px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    .page-header { margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 1.4rem; font-weight: 700; margin: 0; color: var(--text-primary); }

    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .card-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-tertiary);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .card-body { padding: 1.25rem 1rem; }

    .method-option {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0;
    }
    .method-option label { margin: 0; font-size: 0.95rem; color: var(--text-primary); }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .status-row:last-child { margin-bottom: 0; }
    .status-label { font-size: 0.9rem; color: var(--text-muted); }
    .status-badge {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }
    .status-badge.linked { background: var(--success-color, #38a169); color: #fff; }
    .status-badge.unlinked { background: var(--bg-tertiary); color: var(--text-muted); }

    .help-text { font-size: 0.82rem; color: var(--text-muted); line-height: 1.6; margin-top: 0.5rem; }

    .success-alert {
      background: var(--bg-tertiary);
      border: 1px solid var(--success-color, #38a169);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      color: var(--success-color, #38a169);
      font-size: 0.9rem;
      font-weight: 500;
    }
    .error-alert {
      background: var(--bg-tertiary);
      border: 1px solid var(--danger-color, #e53e3e);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      color: var(--danger-color, #e53e3e);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .action-area { margin-top: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; }
  </style>
</head>
<body class="bg-secondary">
  <header th:replace="~{common :: headerFragment}"></header>

  <main class="main-content" style="padding-top: 4rem;">
    <div class="notifications-page">

      <div class="page-header">
        <h1>通知設定</h1>
      </div>

      <div class="success-alert" th:if="${successMessage}" th:text="${successMessage}"></div>
      <div class="error-alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

      <!-- LINE連携 -->
      <div class="profile-card">
        <div class="card-header">LINE連携</div>
        <div class="card-body">
          <div class="status-row">
            <span class="status-label">連携状況</span>
            <span class="status-badge linked" th:if="${lineLinked}">連携済み</span>
            <span class="status-badge unlinked" th:unless="${lineLinked}">未連携</span>
          </div>

          <p class="help-text" th:unless="${lineLinked}">
            LINEアカウントと連携すると、次回以降はLINEでもログインできるようになり、トレーニングサマリーをLINEで受け取れるようになります。
          </p>

          <div class="action-area" th:unless="${lineLinked}">
            <a th:href="@{/user/notifications/line/start}" class="btn btn-primary w-full py-3 font-bold" style="text-align:center; text-decoration:none;">
              LINEアカウントと連携する
            </a>
          </div>

          <div th:if="${lineLinked and addFriendUrl != null}">
            <p class="help-text">
              通知を受け取るには、公式アカウントの友だち追加も必要です（連携だけでは届きません）。
            </p>
            <div class="action-area">
              <a th:href="${addFriendUrl}" target="_blank" rel="noopener" class="btn btn-secondary w-full py-3 font-bold" style="text-align:center; text-decoration:none;">
                公式アカウントを友だち追加する
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- 通知方法 -->
      <form th:action="@{/user/notifications/method}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="profile-card">
          <div class="card-header">通知方法</div>
          <div class="card-body">
            <div class="method-option">
              <input type="radio" id="method-email" name="notificationMethod" value="EMAIL"
                     th:checked="${user.notificationMethod == null or user.notificationMethod == 'EMAIL'}" />
              <label for="method-email">メールのみ</label>
            </div>
            <div class="method-option">
              <input type="radio" id="method-line" name="notificationMethod" value="LINE"
                     th:checked="${user.notificationMethod == 'LINE'}" />
              <label for="method-line">LINEのみ</label>
            </div>
            <div class="method-option">
              <input type="radio" id="method-both" name="notificationMethod" value="BOTH"
                     th:checked="${user.notificationMethod == 'BOTH'}" />
              <label for="method-both">メール・LINE両方</label>
            </div>
            <p class="help-text">
              LINEを選択していても、未連携・未友だち追加の間は自動的にメールへ切り替えて送信されます。
            </p>
          </div>
        </div>
        <div class="action-area">
          <button type="submit" class="btn btn-primary w-full py-3 font-bold">
            通知方法を保存
          </button>
        </div>
      </form>

    </div><!-- /notifications-page -->
  </main>

</body>
</html>
